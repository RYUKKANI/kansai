# [편집 안내] 간사이 전용 설정. private 스키마를 API schemas에 추가하지 않습니다.
project_id = "kansai-united"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[auth]
enabled = true
# 운영 프로젝트의 Authentication > URL Configuration에도 같은 값을 적용합니다.
site_url = "https://kansaiunited.com/"
additional_redirect_urls = ["https://kansaiunited.com/admin/", "https://kansaiunited.com/admin/help/"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
[auth.email]
# CLI에서 이 값은 이메일·비밀번호 제공자도 켭니다. 공개 가입 차단은 위 auth.enable_signup으로 유지합니다.
enable_signup = true
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "10MiB"
[functions.invite-staff]
enabled = true
verify_jwt = true
entrypoint = "./functions/invite-staff/index.ts"
# [편집 안내] 로그인·가입은 익명 진입이 필요합니다. staff-auth 내부에서 bearer·DB 권한·반복 제한을 검사합니다.
# STAFF_AUTH_ENABLED 및 STAFF_AUTH_REGISTRATION_ENABLED는 테스트 통과 후 서버 환경에서 별도로 켭니다.
[functions.staff-auth]
enabled = true
verify_jwt = false
entrypoint = "./functions/staff-auth/index.ts"
