# [편집 안내] 간사이 전용 설정. private 스키마를 API schemas에 추가하지 않습니다.
project_id = "kansai-united"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[auth]
enabled = true
site_url = "https://ryukkani.github.io/kansai/"
additional_redirect_urls = ["https://ryukkani.github.io/kansai/admin/"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
[auth.email]
enable_signup = false
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "10MiB"
[functions.invite-staff]
enabled = true
verify_jwt = true
entrypoint = "./functions/invite-staff/index.ts"
