name: Verify native staff authentication

# 실제 Auth는 deploy.yml에서 변경 파트에 따라 한 번만 실행합니다.
# 이 workflow는 운영 장애 조사 등 명시적으로 요청한 독립 검사에만 사용합니다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # [편집 안내] 운영 프로젝트/저장소 secrets 없이 매번 폐기할 로컬 Auth·DB·메일함을 만듭니다.
      # Docker/메일/Edge가 없거나 실제 복구가 실패하면 이 검사는 건너뛰지 않고 실패합니다.
      - name: Test real GoTrue, Mailpit, RLS and recovery gateway
        run: node scripts/test-native-auth.mjs
