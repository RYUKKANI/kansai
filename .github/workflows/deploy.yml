name: Validate and publish Kansai United
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:
    inputs:
      part:
        description: '검사할 파트 (전체는 all을 명시)'
        required: true
        default: dashboard
        type: choice
        options: [dashboard, auth, members, content, players, schedule, chat, attendance, media, public, security, tooling, all]
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}-${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'workflow_dispatch' && 'manual' || 'code' }}
  cancel-in-progress: true
env:
  ASTRO_TELEMETRY_DISABLED: '1'
  PUBLIC_CMS_ENABLED: ${{ vars.PUBLIC_CMS_ENABLED }}
  PUBLIC_SCHEDULE_ENABLED: ${{ vars.PUBLIC_SCHEDULE_ENABLED }}
  PUBLIC_STAFF_IDENTITY_ENABLED: ${{ vars.PUBLIC_STAFF_IDENTITY_ENABLED }}
  PUBLIC_STAFF_LEGACY_LOGIN_ENABLED: ${{ vars.PUBLIC_STAFF_LEGACY_LOGIN_ENABLED }}
  PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
  PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
jobs:
  plan:
    name: Select affected parts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_parts: ${{ steps.plan.outputs.has_parts }}
      needs_build: ${{ steps.plan.outputs.needs_build }}
      native_auth: ${{ steps.plan.outputs.native_auth }}
      selected_parts: ${{ steps.plan.outputs.selected_parts }}
    steps:
      # 전체 Git 이력을 비교해 여러 커밋 push와 삭제·이름 변경도 누락하지 않습니다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      # 직전 push가 미검증/실패 상태이면 부분 변경으로 실패한 코드를 건너뛰지 않습니다.
      - id: base
        name: Verify preceding push baseline
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-checks.mjs --verify-base
      - id: plan
        name: Plan checks from changed files
        env:
          BASELINE_VERIFIED: ${{ steps.base.outputs.baseline_verified }}
        run: node scripts/plan-checks.mjs
  content:
    name: Check public content version
    needs: plan
    if: needs.plan.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.content.outputs.changed || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      # 예약 실행은 해당 커밋의 코드 검증이 끝난 경우에만 공개 콘텐츠를 재구축합니다.
      - id: verified
        name: Check scheduled commit was validated
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-checks.mjs
      - id: content
        name: Check published content version
        if: github.event_name != 'schedule' || steps.verified.outputs.eligible == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/needs-rebuild.mjs
  build:
    name: Build selected test fixtures and site
    needs: [plan, content]
    if: needs.content.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      # 운영 HTML은 테스트의 가짜 CMS/로그인 설정으로 덮어쓰지 않습니다.
      - name: Build published static pages
        run: npm run build -- --outDir dist-site
      - name: Prepare only selected fixtures
        env:
          SELECTED_PARTS: ${{ join(fromJSON(needs.plan.outputs.selected_parts), ',') }}
        run: npm run test:prepare -- --parts "$SELECTED_PARTS" --artifact
      - name: Share isolated test fixtures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: part-fixtures
          path: part-fixtures/
          if-no-files-found: error
          retention-days: 1
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-site
  part_checks:
    name: Check part / ${{ matrix.part }}
    needs: [plan, content, build]
    if: >-
      ${{ always() && !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.has_parts == 'true' &&
      (needs.plan.outputs.needs_build != 'true' ||
      (needs.content.outputs.changed == 'true' && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download selected fixtures
        if: needs.plan.outputs.needs_build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: part-fixtures
          path: .
      - name: Run this part
        env:
          TEST_PART: ${{ matrix.part }}
        run: npm test -- --part "$TEST_PART"
  native_auth:
    name: Check real authentication when affected
    needs: plan
    if: needs.plan.outputs.native_auth == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLIC_CMS_ENABLED: 'false'
      PUBLIC_SUPABASE_URL: https://identity-test.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_identity_test_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test disposable GoTrue, Mailpit, RLS and recovery
        run: npm run test:auth:native
  checks_complete:
    name: Required part checks complete
    needs: [plan, content, build, part_checks, native_auth]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Reject failures and unexpected skipped checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-results.mjs
  release:
    name: Verify commit can be published
    needs: [build, checks_complete]
    if: >-
      ${{ always() && !cancelled() && needs.build.result == 'success' &&
      needs.checks_complete.result == 'success' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-checks.mjs
  deploy:
    needs: release
    if: >-
      ${{ always() && !cancelled() && needs.release.result == 'success' &&
      needs.release.outputs.eligible == 'true' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # 서로 다른 코드/예약 실행의 게시 순서를 직렬화합니다. 잠금을 얻은 뒤 최신 SHA를 다시 확인합니다.
    concurrency:
      group: pages-publication-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Recheck latest commit inside publication lock
        id: current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { appendFile } from 'node:fs/promises';
          const repository = process.env.GITHUB_REPOSITORY;
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) throw new Error('Invalid repository');
          const response = await fetch(`https://api.github.com/repos/${repository}/git/ref/heads/main`, {
            headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
            redirect: 'error', signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error('Main revision verification failed');
          const revision = (await response.json()).object?.sha;
          if (!/^[0-9a-f]{40,64}$/.test(revision)) throw new Error('Invalid main revision');
          await appendFile(process.env.GITHUB_OUTPUT, `current=${revision === process.env.GITHUB_SHA}\n`);
          JS
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
