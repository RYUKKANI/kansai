name: Validate and publish Kansai United
on:
  push:
    branches: [main]
  pull_request:
    # 기능별 PR을 순서대로 검토하는 경우에도 검사하며, 배포는 아래 main 조건만 통과합니다.
    branches: [main, 'feature/**']
  workflow_dispatch:
  # CMS 발행을 정적 기사 주소로 반영합니다. 변경이 없으면 빌드를 생략합니다.
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
env:
  ASTRO_TELEMETRY_DISABLED: '1'
  PUBLIC_CMS_ENABLED: ${{ vars.PUBLIC_CMS_ENABLED }}
  PUBLIC_SCHEDULE_ENABLED: ${{ vars.PUBLIC_SCHEDULE_ENABLED }}
  PUBLIC_STAFF_IDENTITY_ENABLED: ${{ vars.PUBLIC_STAFF_IDENTITY_ENABLED }}
  PUBLIC_STAFF_LEGACY_LOGIN_ENABLED: ${{ vars.PUBLIC_STAFF_LEGACY_LOGIN_ENABLED }}
  PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
  PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
jobs:
  content:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.content.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: content
        name: Check published content version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/needs-rebuild.mjs
  build:
    needs: content
    if: needs.content.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build published static pages
        run: npm run build
      - name: Export offline preview
        run: npm run export:preview
      # 운영 로그인 플래그를 켠 뒤에도 기존 이메일 전환 경로의 회귀 검사를 유지합니다.
      - name: Build isolated legacy compatibility fixture
        env:
          PUBLIC_CMS_ENABLED: 'false'
          PUBLIC_STAFF_IDENTITY_ENABLED: 'false'
          PUBLIC_SUPABASE_URL: 'https://identity-test.supabase.co'
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_identity_test_only'
        run: npm run build -- --outDir dist-legacy
      - name: Check permissions and interactions
        env:
          ADMIN_TEST_DIST: dist-legacy
        run: npm test
      # 새 로그인 분기는 가짜 연결 정보로 별도 빌드합니다. Pages 업로드는 기존 dist만 사용합니다.
      - name: Build isolated staff identity preview
        env:
          PUBLIC_CMS_ENABLED: 'false'
          PUBLIC_SCHEDULE_ENABLED: 'false'
          PUBLIC_STAFF_IDENTITY_ENABLED: 'true'
          PUBLIC_STAFF_LEGACY_LOGIN_ENABLED: 'true'
          PUBLIC_SUPABASE_URL: 'https://identity-test.supabase.co'
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_identity_test_only'
        run: npm run build -- --outDir dist-identity
      - name: Check staff identity interactions
        env:
          STAFF_IDENTITY_TEST_DIST: dist-identity
        run: node --test tests/staff-identity-app.test.mjs tests/staff-profile-state-app.test.mjs
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    # PR과 개발 브랜치의 수동 실행은 운영 사이트를 배포하지 않습니다.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
